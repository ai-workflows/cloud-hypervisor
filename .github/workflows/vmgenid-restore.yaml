# SPDX-License-Identifier: Apache-2.0
#
# The VM generation ID device end to end. A guest with no agent is snapshotted once and
# restored twice; with --vmgenid each restore must reseed the guest CRNG before its first read and
# the two restored guests must read different kernel UUIDs (scripts/vmgenid-restore-test.py).
name: vmgenid restore
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  vmgenid-restore:
    name: vmgenid over snapshot/restore (real guest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Code checkout
        uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Build Cloud Hypervisor
        run: cargo build --locked --release --bin cloud-hypervisor --bin ch-remote
      - name: Restore one snapshot twice, with and without --vmgenid
        run: >-
          python3 scripts/vmgenid-restore-test.py
          --cloud-hypervisor target/release/cloud-hypervisor
          --ch-remote target/release/ch-remote
          --restores 10
